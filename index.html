<script>
  const PASSWORD = "RUTA2026";
  let hasUnsavedChanges = false;

  const INITIAL_DATA = [
    {
      id: "gobernanza",
      name: "Gobernanza",
      items: [
        { id: "g-1", subcategory: "Convenio / Tratado Marco", title: "Contratar consultor abogado (Alan Thomson) para acompañamiento del BID en la estructuración técnica de la gobernanza", period: "2", months: [2] },
        { id: "g-2", subcategory: "Convenio / Tratado Marco", title: "Análisis sobre si corresponde convenio o tratado marco y modelo de gobernanza para proyectos piloto", period: "3", months: [3] },
        { id: "g-3", subcategory: "Convenio / Tratado Marco", title: "Preparación y socialización del borrador de convenio/tratado con comisiones y/o gobernanza para pilotos", period: "4-5", months: [4,5] },
        { id: "g-4", subcategory: "Convenio / Tratado Marco", title: "Firma del borrador de convenio/tratado marco en consejo intersectorial de ministros", period: "6", months: [6] },
        { id: "g-5", subcategory: "Convenio / Tratado Marco", title: "Instrumento legal borrador para la gobernanza de los pilotos (a nivel de ministros de los 2 países participantes)", period: "6", months: [6] },
        { id: "g-6", subcategory: "Unidad Ejecutora Inicial", title: "Contratar 2 consultores (coordinador y apoyo técnico) dentro de SIECA temporalmente", period: "7-12", months: [7,8,9,10,11,12] },
        { id: "g-7", subcategory: "Entrada en funcionamiento de instituciones regionales nuevas", title: "Diseño detallado del esquema administrativo, operativo, financiero y funcional conforme al CM y estudio técnico", period: "7-12", months: [7,8,9,10,11,12] },
        { id: "g-8", subcategory: "Entrada en funcionamiento de instituciones regionales nuevas", title: "Inicio en funcionamiento", period: "", months: [] }
      ]
    },
    {
      id: "tecnicos",
      name: "Técnicos",
      items: [
        { id: "t-1", subcategory: "Estudios de ingeniería", title: "Preparación de TdR para el diseño de los proyectos piloto (PN-CR Paso Canoas y ES-HO Amatillo) y estudio de factibilidad técnica avanzada de Cargo Pass", period: "1-2", months: [1,2] },
        { id: "t-2", subcategory: "Estudios de ingeniería", title: "Proyectos piloto (PN-CR Paso Canoas y ES-HO Amatillo) y estudio de factibilidad técnica avanzada de Cargo Pass", period: "3-10", months: [3,4,5,6,7,8,9,10] },
        { id: "t-3", subcategory: "Estudios de derivación de carga y viabilidad", title: "Estudio de demanda, DAP y viabilidad de derivación de carga al CargoPass", period: "2-9", months: [2,3,4,5,6,7,8,9] },
        { id: "t-4", subcategory: "Análisis económica, financiera, riesgos y legal", title: "Estudio de viabilidad financiera y económica final, análisis de riesgos, acorde a procesos y guías de programación en los países", period: "9-11", months: [9,10,11] },
        { id: "t-5", subcategory: "Estudios de tiempos de viaje", title: "Estudios de tiempos de viaje de todo el corredor, incluyendo puestos de frontera", period: "3-8", months: [3,4,5,6,7,8] },
        { id: "t-6", subcategory: "Análisis del OEA para todo el corredor", title: "Diagnóstico para el análisis de los programas nacionales del Operador Económico Autorizado (tipificación, alcance y acuerdos de reconocimiento mutuo)", period: "2-10", months: [2,3,4,5,6,7,8,9,10] }
      ]
    },
    {
      id: "fondeo",
      name: "Fondeo",
      items: [
        { id: "f-1", subcategory: "Fondo 1 de preinversión", title: "Para Unidad Ejecutora inicial y para estudios de preinversión (CTs actuales del Banco, nuevos fondos JICA, UE, etc.)", period: "3-11", months: [3,4,5,6,7,8,9,10,11] },
        { id: "f-2", subcategory: "Fondo 2 de operación para la gobernanza", title: "Para Unidad Ejecutora inicial y arranque del funcionamiento de la gobernanza (CTs actuales del Banco, nuevos fondos JICA, UE, etc.)", period: "", months: [] },
        { id: "f-3", subcategory: "Fondo 3 implementación", title: "CCLIP del BID más un champion", period: "", months: [] }
      ]
    }
  ];

  const SECTION_STYLES = {
    gobernanza: { color: "#003F72", chipClass: "chip-blue" },
    tecnicos: { color: "#0F5B78", chipClass: "chip-teal" },
    fondeo: { color: "#5B6B7A", chipClass: "chip-slate" }
  };

  let sections = loadData();
  let query = "";
  let collapsedSections = {};
  let draft = {
    sectionId: "gobernanza",
    subcategory: "",
    title: "",
    period: "",
    months: Array(12).fill("")
  };

  function loadData() {
    try {
      const saved = localStorage.getItem("actividades_hitos_data");
      return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_DATA));
    } catch {
      return JSON.parse(JSON.stringify(INITIAL_DATA));
    }
  }

  function uid() {
    return Math.random().toString(36).slice(2, 9);
  }

  function monthsFromInputs(values) {
    const out = [];
    values.forEach((value, index) => {
      if (String(value).trim() !== "") out.push(index + 1);
    });
    return out;
  }

  function inputsFromMonths(months) {
    return Array.from({ length: 12 }, (_, i) => months.includes(i + 1) ? "1" : "");
  }

  function parsePeriodToMonths(period) {
    const value = String(period || "").trim();
    if (!value) return [];

    const normalized = value.replace(/–/g, "-").replace(/\s+/g, "");

    if (/^\d+$/.test(normalized)) {
      const n = Number(normalized);
      if (n >= 1 && n <= 12) return [n];
      return [];
    }

    const rangeMatch = normalized.match(/^(\d+)-(\d+)$/);
    if (rangeMatch) {
      const start = Number(rangeMatch[1]);
      const end = Number(rangeMatch[2]);

      if (start >= 1 && start <= 12 && end >= 1 && end <= 12 && start <= end) {
        const months = [];
        for (let i = start; i <= end; i++) months.push(i);
        return months;
      }
    }

    return [];
  }

  function filteredSections() {
    const q = query.trim().toLowerCase();
    if (!q) return sections;

    return sections
      .map(section => ({
        ...section,
        items: section.items.filter(item =>
          section.name.toLowerCase().includes(q) ||
          item.subcategory.toLowerCase().includes(q) ||
          item.title.toLowerCase().includes(q) ||
          (item.period || "").toLowerCase().includes(q)
        )
      }))
      .filter(section => section.items.length > 0);
  }

  function monthlyCounts() {
    const counts = Array.from({ length: 12 }, (_, i) => ({ mes: i + 1, total: 0 }));
    sections.forEach(section => {
      section.items.forEach(item => {
        item.months.forEach(m => counts[m - 1].total++);
      });
    });
    return counts;
  }

  function getSectionDuration(section) {
    const allMonths = section.items.flatMap(item => item.months || []);
    if (!allMonths.length) return "Sin periodo";
    const min = Math.min(...allMonths);
    const max = Math.max(...allMonths);
    return min === max ? `${min}` : `${min}-${max}`;
  }

  function updateItem(sectionId, itemId, patch) {
    sections = sections.map(section =>
      section.id !== sectionId
        ? section
        : {
            ...section,
            items: section.items.map(item =>
              item.id === itemId ? { ...item, ...patch } : item
            )
          }
    );
    hasUnsavedChanges = true;
    render();
  }

  function saveChanges() {
    const ok = confirm("¿Quieres guardar los cambios?");
    if (!ok) return;

    const pwd = prompt("Ingresa la contraseña para guardar:");
    if (pwd !== PASSWORD) {
      alert("Contraseña incorrecta.");
      return;
    }

    localStorage.setItem("actividades_hitos_data", JSON.stringify(sections));
    hasUnsavedChanges = false;
    alert("Cambios guardados.");
  }

  function exportExcelHtml() {
    let html = '<table border="1"><tr><th>Sección</th><th>Subcategoría</th><th>Actividad</th><th>Periodo</th>';
    for (let i = 1; i <= 12; i++) html += `<th>Mes ${i}</th>`;
    html += '</tr>';

    sections.forEach(section => {
      section.items.forEach(item => {
        html += `<tr>
          <td>${escapeHtml(section.name)}</td>
          <td>${escapeHtml(item.subcategory)}</td>
          <td>${escapeHtml(item.title)}</td>
          <td>${escapeHtml(item.period || "")}</td>
        `;
        for (let i = 1; i <= 12; i++) {
          html += `<td>${item.months.includes(i) ? 1 : ''}</td>`;
        }
        html += '</tr>';
      });
    });

    html += '</table>';

    const full = `<html><head><meta charset="utf-8"></head><body>${html}</body></html>`;
    const blob = new Blob([full], { type: 'application/vnd.ms-excel' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'actividades_hitos.xls';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;');
  }

  function renderChart() {
    const c = document.getElementById('chartGrid');
    const data = monthlyCounts();
    const max = Math.max(1, ...data.map(d => d.total));

    c.innerHTML = data.map(d => `
      <div class="bar-col">
        <div class="bar-track">
          <div class="bar-fill" style="height:${(d.total / max) * 100}%"></div>
        </div>
        <div class="bar-value">${d.total}</div>
        <div class="bar-label">Mes ${d.mes}</div>
      </div>
    `).join('');
  }

  function renderTable() {
    const wrap = document.getElementById("tableSections");

    wrap.innerHTML = filteredSections().map(section => {
      const style = SECTION_STYLES[section.id];
      const duration = getSectionDuration(section);
      const isCollapsed = !!collapsedSections[section.id];

      return `
        <div class="section-block">
          <div class="section-header-bar">
            <div class="section-title-wrap">
              <div class="section-title" style="background:${style.color}">
                ${escapeHtml(section.name)}
              </div>
              <div class="section-meta">
                <span class="section-duration">Duración total: ${duration}</span>
              </div>
            </div>
            <button class="section-toggle" data-toggle-section="${section.id}">
              ${isCollapsed ? 'Expandir' : 'Contraer'}
            </button>
          </div>

          <div class="section-body ${isCollapsed ? 'collapsed' : ''}">
            ${section.items.map(item => {
              const monthInputs = inputsFromMonths(item.months);

              return `
                <div class="data-row">
                  <div class="cell left col-activity">
                    <div>
                      <div style="margin-bottom:8px">
                        <span class="chip ${style.chipClass}">${escapeHtml(item.subcategory)}</span>
                      </div>
                      <textarea data-title="${section.id}|${item.id}">${escapeHtml(item.title)}</textarea>
                    </div>
                  </div>

                  <div class="cell">
                    <input class="small-input" data-period="${section.id}|${item.id}" value="${escapeHtml(item.period || "")}" placeholder="2-5 o 2">
                  </div>

                  ${monthInputs.map((value, idx) => `
                    <div class="cell">
                      <input
                        class="month-input ${value ? 'active' : ''}"
                        data-month="${section.id}|${item.id}|${idx + 1}"
                        value=""
                        placeholder=""
                        readonly
                      >
                    </div>
                  `).join("")}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }).join("");
  }

  function renderDraftSections() {
    document.getElementById('draftSection').innerHTML = sections.map(s => `
      <option value="${s.id}" ${s.id === draft.sectionId ? 'selected' : ''}>
        ${escapeHtml(s.name)}
      </option>
    `).join('');
  }

  function renderDraftMonths() {
    document.getElementById("draftMonths").innerHTML = Array.from({ length: 12 }, (_, i) => `
      <input
        class="month-input ${draft.months[i] ? 'active' : ''}"
        data-draft-month="${i}"
        value=""
        placeholder="${i + 1}"
        readonly
      >
    `).join("");
  }

  function bindEvents() {
    document.querySelectorAll('textarea[data-title]').forEach(el => {
      el.onchange = () => {
        const [sectionId, itemId] = el.dataset.title.split('|');
        updateItem(sectionId, itemId, { title: el.value });
      };
    });

    document.querySelectorAll('[data-period]').forEach(el => {
      el.onchange = () => {
        const [sectionId, itemId] = el.dataset.period.split('|');
        const newPeriod = el.value.trim();
        const parsedMonths = parsePeriodToMonths(newPeriod);

        updateItem(sectionId, itemId, {
          period: newPeriod,
          months: parsedMonths
        });
      };
    });

    document.querySelectorAll('[data-month]').forEach(el => {
      el.onclick = () => {
        const [sectionId, itemId, month] = el.dataset.month.split('|');
        const monthNumber = Number(month);

        const section = sections.find(s => s.id === sectionId);
        const item = section.items.find(i => i.id === itemId);

        const hasMonth = item.months.includes(monthNumber);
        const newMonths = hasMonth
          ? item.months.filter(m => m !== monthNumber)
          : [...item.months, monthNumber].sort((a, b) => a - b);

        updateItem(sectionId, itemId, { months: newMonths });
      };
    });

    document.querySelectorAll('[data-draft-month]').forEach(el => {
      el.onclick = () => {
        const idx = Number(el.dataset.draftMonth);
        draft.months[idx] = draft.months[idx] ? "" : "1";
        renderDraftMonths();
      };
    });

    document.querySelectorAll('[data-toggle-section]').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.toggleSection;
        collapsedSections[id] = !collapsedSections[id];
        render();
      };
    });
  }

  function render() {
    renderChart();
    renderTable();
    renderDraftSections();
    renderDraftMonths();
    bindEvents();
  }

  document.getElementById('searchInput').oninput = e => {
    query = e.target.value;
    render();
  };

  document.getElementById('exportBtn').onclick = exportExcelHtml;
  document.getElementById('saveBtn').onclick = saveChanges;

  document.getElementById('addBtn').onclick = () => {
    document.getElementById('modalBackdrop').classList.add('show');
  };

  document.getElementById('closeModal').onclick = () => {
    document.getElementById('modalBackdrop').classList.remove('show');
  };

  document.getElementById('modalBackdrop').onclick = e => {
    if (e.target.id === 'modalBackdrop') {
      e.currentTarget.classList.remove('show');
    }
  };

  document.getElementById('draftSection').onchange = e => {
    draft.sectionId = e.target.value;
  };

  document.getElementById('draftSubcategory').oninput = e => {
    draft.subcategory = e.target.value;
  };

  document.getElementById('draftTitle').oninput = e => {
    draft.title = e.target.value;
  };

  document.getElementById('draftPeriod').oninput = e => {
    draft.period = e.target.value;
  };

  document.getElementById('saveDraft').onclick = () => {
    if (!draft.subcategory.trim() || !draft.title.trim()) return;

    const months = draft.period.trim()
      ? parsePeriodToMonths(draft.period)
      : monthsFromInputs(draft.months);

    sections = sections.map(section =>
      section.id !== draft.sectionId
        ? section
        : {
            ...section,
            items: [
              ...section.items,
              {
                id: uid(),
                subcategory: draft.subcategory,
                title: draft.title,
                period: draft.period,
                months
              }
            ]
          }
    );

    hasUnsavedChanges = true;

    draft = {
      sectionId: draft.sectionId,
      subcategory: "",
      title: "",
      period: "",
      months: Array(12).fill("")
    };

    document.getElementById('draftSubcategory').value = '';
    document.getElementById('draftTitle').value = '';
    document.getElementById('draftPeriod').value = '';
    document.getElementById('modalBackdrop').classList.remove('show');
    render();
  };

  window.addEventListener("beforeunload", function (e) {
    if (!hasUnsavedChanges) return;
    e.preventDefault();
    e.returnValue = "";
  });

  render();
</script>
